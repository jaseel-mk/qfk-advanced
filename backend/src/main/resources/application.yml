spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qfk}
    username: ${DATABASE_USERNAME:qfk}
    password: ${DATABASE_PASSWORD:qfk_dev_only}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
server:
  port: ${PORT:8080}
  error.include-stacktrace: never
  tomcat.max-http-form-post-size: 2MB
qfk:
  timezone: Asia/Qatar
  jwt-secret: ${JWT_SECRET:development-only-secret-must-be-replaced-before-production}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:no-reply@qfk-qatar.com}
  brevo-api-key: ${BREVO_API_KEY:}
